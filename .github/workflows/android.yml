name: Build e Release Android v4.1.0

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correção responsiva da Home
        shell: bash
        run: |
          if grep -q '\.size(144.dp)' app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt; then
            python tools/fix_v40_phone_layout.py
          else
            echo "Layout compacto já aplicado."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable APK sem chave privada
        run: gradle :app:assembleDebug --stacktrace

      - name: Persistir correção responsiva no main
        shell: bash
        run: |
          if ! git diff --quiet -- app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/br/com/monitordenoticias/android/V30Screens.kt
            git commit -m "Corrige responsividade da Home V40 em celulares"
            git push origin HEAD:main
          fi

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk monitor-de-noticias-v4.1.0-layout-v40-r2-dev.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor-de-noticias-v4.1.0-layout-v40-r2-dev
          path: monitor-de-noticias-v4.1.0-layout-v40-r2-dev.apk
          if-no-files-found: error
          retention-days: 30

      - name: Criar ou atualizar release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.0-layout-v40-r2
          name: Monitor de Notícias Android v4.1.0 - Layout V40 R2
          body: |
            Revisão responsiva da Home para telas de celular.
            Corrige compressão de textos nos cartões de monitoramento, métricas e vídeos.
            APK compilado sem a chave privada do projeto, usando assinatura debug do Android.
          files: monitor-de-noticias-v4.1.0-layout-v40-r2-dev.apk
          make_latest: true
